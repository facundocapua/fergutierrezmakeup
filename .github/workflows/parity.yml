name: Parity

# Compares each successful preview deployment with production. See docs/parity.md.
on: deployment_status

permissions:
  contents: read

jobs:
  parity:
    name: Visual parity
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    env:
      PARITY_URL: ${{ github.event.deployment_status.environment_url }}
      VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check the preview is reachable
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: $VERCEL_BYPASS_SECRET" "$PARITY_URL")
          if [ "$status" != "200" ]; then
            echo "::error::Preview returned HTTP $status. Check the VERCEL_BYPASS_SECRET repository secret (docs/parity.md)."
            exit 1
          fi
      - name: Record the baseline from production
        run: pnpm parity:baseline
        env:
          PARITY_URL: ''
          VERCEL_BYPASS_SECRET: ''
      - name: Compare the preview with production
        run: pnpm parity
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: parity-report
          path: |
            playwright-report
            test-results
          retention-days: 14
